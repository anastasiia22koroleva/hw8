plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

// ---------- Hibernate / JPA ----------
// Версии вынесены в переменные, чтобы менять их в одном месте.
ext {
    hibernateVersion = '6.6.29.Final'
    jakartaPersistenceVersion = '3.1.0'
    h2Version = '2.3.232'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceVersion}"
    runtimeOnly "com.h2database:h2:${h2Version}"
}
// -------------------------------------

group = 'messages'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // собирается под Java 17 на любом JDK новее: --release не пустит API из более новых версий
    options.release = 17
    // имена параметров нужны Spring для @PathVariable без явного имени
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ./gradlew bootRun -Pjfr  - запуск с записью Java Flight Recorder в build/jfr/
tasks.named('bootRun') {
    if (project.hasProperty('jfr')) {
        def dir = layout.buildDirectory.dir('jfr').get().asFile
        doFirst { dir.mkdirs() }
        // стеки у Spring + Hibernate глубже 64 кадров (значение по умолчанию), иначе flame graph обрезается
        jvmArgs '-XX:FlightRecorderOptions=stackdepth=256',
                "-XX:StartFlightRecording=name=app,settings=profile,filename=${dir}/app.jfr"
    }
}

// Заполнение базы тестовыми сообщениями. Приложение должно быть уже запущено (./gradlew bootRun).
// Параметры: -Pmessages=1000 -Pauthors=50 -Phost=http://localhost:8080
tasks.register('runTestDataInitializer', Exec) {
    group = 'application'
    description = 'Отправляет POST /api/messages с тестовыми сообщениями'

    def messages = (project.findProperty('messages') ?: '1000') as int
    def authors = (project.findProperty('authors') ?: '50') as int
    def host = project.findProperty('host') ?: 'http://localhost:8080'
    def dataFile = layout.buildDirectory.file('test-data.json').get().asFile

    doFirst {
        def random = new Random(42)
        def words = ['привет', 'как', 'дела', 'сегодня', 'завтра', 'встреча', 'отчёт', 'gradle',
                     'spring', 'база', 'запрос', 'готово', 'проверь', 'посмотри', 'ок', 'спасибо']
        def body = (1..messages).collect { i ->
            def text = (1..(3 + random.nextInt(8))).collect { words[random.nextInt(words.size())] }.join(' ')
            [author: "user${(i - 1) % authors + 1}", text: "#${i} ${text}"]
        }
        dataFile.parentFile.mkdirs()
        dataFile.text = groovy.json.JsonOutput.toJson(body)
        println "Отправляю ${messages} сообщений от ${authors} авторов на ${host}/api/messages"
    }

    commandLine 'curl', '-sS', '--fail-with-body',
            '-X', 'POST', "${host}/api/messages",
            '-H', 'Content-Type: application/json; charset=utf-8',
            '--data-binary', "@${dataFile}"

    doLast { println() }
}
