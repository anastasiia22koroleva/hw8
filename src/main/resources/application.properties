spring.application.name=messages

spring.datasource.url=jdbc:h2:mem:messages;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Без этого Spring держит сессию Hibernate открытой до конца HTTP-запроса,
# и LazyInitializationException в контроллере не воспроизвести.
spring.jpa.open-in-view=false

# Консоль H2: http://localhost:8080/h2-console (JDBC URL как выше)
spring.h2.console.enabled=true
